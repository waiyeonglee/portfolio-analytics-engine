name: Sync to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  sync-to-s3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::847314899825:role/github_to_access_s3
          aws-region: ap-southeast-1

      - name: Sync to S3
        run: |
          aws s3 sync scripts/ s3://moomoos3/scripts/
