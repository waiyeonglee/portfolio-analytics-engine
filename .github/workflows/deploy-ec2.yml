name: Deploy portfolio engine to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sync repository and restart services
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_KNOWN_HOSTS"

          ssh_key="$RUNNER_TEMP/ec2_deploy_key"
          known_hosts="$RUNNER_TEMP/ec2_known_hosts"
          trap 'rm -f "$ssh_key" "$known_hosts"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" > "$ssh_key"
          chmod 600 "$ssh_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts"

          ssh \
            -i "$ssh_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts" \
            "ubuntu@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/moomoo_scripts
          git pull --ff-only origin main
          /home/ubuntu/.local/bin/uv sync --locked --no-dev
          /home/ubuntu/.local/bin/uv run --locked --no-dev python -c "import scripts.main; print('Imports OK')"
          sudo systemctl restart moomoo_real moomoo_simulate
          sudo systemctl is-active --quiet moomoo_real
          sudo systemctl is-active --quiet moomoo_simulate
          REMOTE